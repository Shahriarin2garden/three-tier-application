services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: crud_operations
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ../server
    ports:
      - "3000:3000"
    restart: on-failure
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_DATABASE: crud_operations
      DB_WAITFORCONNECTIONS: "true"
      DB_CONNECTIONLIMIT: 10
      DB_QUEUELIMIT: 0
      DB_TABLENAME: users
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      server:
        condition: service_started

volumes:
  mysql_data: